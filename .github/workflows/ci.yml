name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão do Playwright
        id: playwright
        run: echo "versao=$(pnpm --filter bandeiras-web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      - run: pnpm --filter bandeiras-web exec playwright install --with-deps chromium
      - run: pnpm verify
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_CHAVE_ANONIMA: ${{ vars.VITE_SUPABASE_CHAVE_ANONIMA }}
          VITE_CLERK_CHAVE_PUBLICA: ${{ vars.VITE_CLERK_CHAVE_PUBLICA }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_CHAVE_PUBLICA }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_USUARIO_EMAIL: ${{ secrets.E2E_USUARIO_EMAIL }}
          E2E_USUARIO_SENHA: ${{ secrets.E2E_USUARIO_SENHA }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: apps/web/test-results
          if-no-files-found: ignore
